[package]
name = "acquisition-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "acquisition_server"
path = "src/lib.rs"

[[bin]]
name = "acquisition-server"
path = "src/main.rs"

[[test]]
name = "aruco_e2e"
required-features = ["aruco-auto-record"]

[[example]]
name = "aruco_bench"
required-features = ["aruco-auto-record"]

[dev-dependencies]
tempfile = "3"

[features]
default = []
# Auto-start/stop recordings when configured ArUco markers come into view.
# Off by default: it pulls in the arucotools git dependency and spawns a detector thread.
aruco-auto-record = ["dep:arucotools"]

[dependencies]
acquisition-common = { path = "../acquisition-common" }
pylon = { path = "../pylon" }
clap = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
postcard = { workspace = true }
uuid = { workspace = true }
turbojpeg = { workspace = true }
arucotools = { workspace = true, optional = true }
