[workspace]
members = ["crates/pylon", "crates/acquisition-common", "crates/acquisition-server", "crates/acquisition-client", "crates/sync-analysis"]
resolver = "3"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.47", features = ["local-offset", "serde", "serde-well-known", "formatting", "parsing", "macros"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "io-std", "io-util", "net", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
postcard = { version = "1", features = ["use-std"] }
eframe = "0.34"
image = "0.25"
png = "0.18"
turbojpeg = "1"
rayon = "1"
uuid = { version = "1.23.1", features = [ "v4", "serde"] }
# Pinned to a rev rather than tracking a branch: the crate is alpha and its README warns
# that breaking API changes are expected. Only pulled in by the `aruco-auto-record`
# feature of acquisition-server.
arucotools = { git = "ssh://git@gitlab.psb.ugent.be/samey/arucotools-rs.git", rev = "4a57f4758ea726eb5ff605a62e178069ffb077d5", default-features = false }
 